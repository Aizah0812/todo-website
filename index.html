<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaskFlow</title>
    <link rel="icon" type="image/png" href="./logo.png" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="app-container">
      <div class="todo-card">
        <!-- Top Bar -->
        <div class="top-bar">
          <div class="top-section">
            <div class="logo">
              <svg
                width="42"
                height="42"
                viewBox="0 0 100 100"
                fill="none"
                aria-hidden="true"
              >
                <defs>
                  <linearGradient
                    id="taskflowGradient"
                    x1="0"
                    y1="0"
                    x2="100"
                    y2="100"
                  >
                    <stop offset="0%" stop-color="#6366f1" />
                    <stop offset="100%" stop-color="#8b5cf6" />
                  </linearGradient>
                </defs>

                <circle cx="50" cy="50" r="45" fill="url(#taskflowGradient)" />
                <path
                  d="M30 50 L45 65 L70 35"
                  stroke="white"
                  stroke-width="6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>

              <h3>TaskFlow</h3>
            </div>

            <p>Organize your life with smart tasks and better productivity.</p>
          </div>

          <div class="top-actions">
            <button type="button" id="themeToggleBtn" class="theme-toggle-btn">
              Toggle Theme
            </button>
            <button type="button" id="logoutBtn" class="theme-toggle-btn">
              Logout
            </button>
          </div>
        </div>

        <!-- User Section -->
        <div class="user-section">
          <input
            type="text"
            id="usernameInput"
            placeholder="Enter your name"
            autocomplete="name"
          />
          <button type="button" id="saveUserBtn">Save</button>
        </div>

        <!-- Welcome -->
        <div class="welcome-box">
          <h2 id="welcomeText">Welcome!</h2>
        </div>

        <!-- Search -->
        <div class="search-section">
          <input
            type="text"
            id="searchInput"
            placeholder="Search your tasks..."
            autocomplete="off"
          />
        </div>

        <!-- Task Input -->
        <div class="todo-input-section">
          <input
            type="text"
            id="taskInput"
            placeholder="Enter your task..."
            autocomplete="off"
          />

          <input type="date" id="dueDateInput" />

          <select id="priorityInput">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
          </select>

          <select id="categoryInput">
            <option value="Study">Study</option>
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
          </select>

          <button type="button" id="addTaskBtn">Add</button>
        </div>

        <!-- New Feature: Notes -->
        <div class="notes-section">
          <textarea
            id="notesInput"
            placeholder="Add task notes (optional)..."
            rows="3"
          ></textarea>
        </div>

        <!-- New Feature: Sort -->
        <div class="sort-section">
          <label for="sortSelect">Sort Tasks:</label>
          <select id="sortSelect">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="priorityHigh">Priority: High to Low</option>
            <option value="priorityLow">Priority: Low to High</option>
            <option value="dueSoon">Due Date: Soonest</option>
            <option value="alphabetical">Alphabetical</option>
          </select>
        </div>

        <!-- Filters -->
        <div class="filter-section">
          <button type="button" class="filter-btn active" data-filter="all">
            All
          </button>
          <button type="button" class="filter-btn" data-filter="pending">
            Pending
          </button>
          <button type="button" class="filter-btn" data-filter="completed">
            Completed
          </button>
          <button type="button" class="filter-btn" data-filter="today">
            Due Today
          </button>
          <button type="button" class="filter-btn" data-filter="overdue">
            Overdue
          </button>
        </div>

        <!-- Progress -->
        <div class="progress-card">
          <div class="progress-header">
            <span>Task Progress</span>
            <span id="progressText">0% Completed</span>
          </div>
          <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
          </div>
        </div>

        <!-- Stats + Actions -->
        <div class="stats-section">
          <span id="taskCount">0</span>
          <div class="stats-actions">
            <button type="button" id="markAllCompleteBtn">
              Mark All Complete
            </button>
            <button type="button" id="markAllPendingBtn">
              Mark All Pending
            </button>
            <button type="button" id="clearCompletedBtn">
              Clear Completed
            </button>
          </div>
        </div>

        <!-- Import / Export -->
        <div class="import-export-section">
          <button type="button" id="exportTasksBtn">Export Tasks</button>

          <label for="importTasksInput" class="import-label">
            Import Tasks
          </label>
          <input type="file" id="importTasksInput" accept=".json" />
        </div>

        <!-- Task List -->
        <ul id="taskList" class="task-list"></ul>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state">
          No tasks yet! Add your first task to get started.
        </div>
      </div>

      <!-- Footer -->
      <div class="footer">
        <span>&copy; 2026 TaskFlow. All rights reserved.</span>
        <span>Made with ❤️ by Aizah</span>
      </div>
    </div>

    <script src="index.js" defer></script>
  </body>
</html>
